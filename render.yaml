# render.yaml — for Vite/React frontend deployment on Render

services:
  - type: web
    name: climate-health-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_BASE
        value: https://climate-health-backend-fexw.onrender.com/api/
