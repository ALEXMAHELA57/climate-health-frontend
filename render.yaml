# render.yaml — for Vite React deployment

services:
  - type: web
    name: climate-health-frontend
    env: static
    buildCommand: chmod +x node_modules/.bin/vite && npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE
        value: https://climate-health-backend-fexw.onrender.com/api/
